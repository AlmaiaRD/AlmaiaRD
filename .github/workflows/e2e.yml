name: E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL base para ejecutar los tests (preproducción o producción)"
        required: false
        default: "https://almaia-rd.vercel.app"
  push:
    branches: [main]

# Mínimo privilegio: este workflow solo necesita leer el código.
permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E
    # Interruptor: crea la VARIABLE E2E_ENABLED=true en Settings > Secrets and
    # variables > Actions > Variables. Los secrets no pueden usarse en job.if.
    if: ${{ vars.E2E_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BASE_URL: ${{ github.event.inputs.base_url || vars.PLAYWRIGHT_BASE_URL || 'https://almaia-rd.vercel.app' }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      # Necesarias para que critical-path.spec.ts borre al terminar lo que
      # crea. No son secretos: son las mismas dos que ya viajan dentro del
      # paquete de la web, cualquiera que abra el código las puede leer. Sin
      # ellas la limpieza se salta y la base de pruebas acumula facturas falsas
      # en cada ejecución.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium

      - name: Esperar a que la app responda
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$PLAYWRIGHT_BASE_URL/login" || true)
            echo "Intento $i/30 -> HTTP $code"
            [ "$code" = "200" ] && break
            sleep 10
          done

      - name: Ejecutar tests E2E
        run: npm run test:e2e