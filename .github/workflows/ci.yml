name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Mínimo privilegio: este workflow solo necesita leer el código.
permissions:
  contents: read

# Cancela la ejecución anterior del mismo ref cuando llega una nueva.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      # El build es la comprobación que faltaba: sin ella, un cambio que rompe
      # `next build` puede mergearse en verde. src/lib/supabase.ts lanza en tiempo
      # de import si faltan estas variables, así que se pasan placeholders: las
      # NEXT_PUBLIC_* se inlinean al compilar y el build no contacta Supabase.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      - run: npm audit --audit-level=high
