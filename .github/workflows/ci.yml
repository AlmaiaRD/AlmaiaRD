name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Mínimo privilegio: este workflow solo necesita leer el código.
permissions:
  contents: read

# Cancela la ejecución anterior del mismo ref cuando llega una nueva.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      # El build es la comprobación que faltaba: sin ella, un cambio que rompe
      # `next build` puede mergearse en verde. src/lib/supabase.ts lanza en tiempo
      # de import si faltan estas variables, así que se pasan placeholders: las
      # NEXT_PUBLIC_* se inlinean al compilar y el build no contacta Supabase.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      # PUERTA 1 (bloqueante): lo que realmente se despliega en Vercel.
      # `--omit=dev` excluye las herramientas de desarrollo, que nunca llegan
      # a producción. Esta puerta hoy da 0 vulnerabilidades.
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high

      # PUERTA 2 (informativa): las herramientas de desarrollo sí se auditan,
      # pero NO rompen el build.
      #
      # Por qué no bloquea: las 5 vulnerabilidades vienen por la cadena
      #   eslint-config-next -> @next/eslint-plugin-next -> fast-glob
      #                        -> micromatch -> braces
      # y todas son de desarrollo (lint). El aviso GHSA-vfj7-8cjw-p6xm
      # (braces, "stack-exhaustion denial of service") se publicó el 2026-09-18
      # y declara `first_patched_version: null`: braces@3.0.3 es la última
      # versión publicada y sigue estando afectada, así que hoy no hay arreglo
      # posible. `npm audit fix --force` "lo arregla" bajando eslint-config-next
      # a 14.2.35, dos versiones mayores por debajo de la 16 que usa este
      # proyecto, lo que rompería el lint de Next.js 16.
      #
      # Esta puerta volverá a bloquear en cuanto braces publique una versión
      # corregida; basta con quitar `continue-on-error` en ese momento.
      - name: Auditoría de dependencias de desarrollo (informativa)
        continue-on-error: true
        run: npm audit --audit-level=high
