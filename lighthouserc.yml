ci:
  collect:
    url:
      - https://almaia-rd.vercel.app
      - https://almaia-rd.vercel.app/dashboard
      - https://almaia-rd.vercel.app/facturacion
      - https://almaia-rd.vercel.app/cotizaciones
      - https://almaia-rd.vercel.app/catalogo
      - https://almaia-rd.vercel.app/clientes
      - https://almaia-rd.vercel.app/inventario
    numberOfRuns: 3
    settings:
      headful: false
      staticDistDir: ./out
  assert:
    assertions:
      categories:performance: ["error", { minScore: 0.9 }]
      categories:accessibility: ["error", { minScore: 0.9 }]
      categories:best-practices: ["error", { minScore: 0.9 }]
      categories:seo: ["error", { minScore: 0.8 }]
      first-contentful-paint: ["error", { maxNumericValue: 2500 }]
      largest-contentful-paint: ["error", { maxNumericValue: 2500 }]
      total-blocking-time: ["error", { maxNumericValue: 200 }]
      cumulative-layout-shift: ["error", { maxNumericValue: 0.1 }]
      interactive: ["error", { maxNumericValue: 3500 }]
  upload:
    target: temporary-public-storage