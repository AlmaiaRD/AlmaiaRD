        function numeroALetras(num) {
            const unidades = ['', 'UN', 'DOS', 'TRES', 'CUATRO', 'CINCO', 'SEIS', 'SIETE', 'OCHO', 'NUEVE'];
            const decenas = ['', 'DIEZ', 'VEINTE', 'TREINTA', 'CUARENTA', 'CINCUENTA', 'SESENTA', 'SETENTA', 'OCHENTA', 'NOVENTA'];
            const especiales = {
                11: 'ONCE', 12: 'DOCE', 13: 'TRECE', 14: 'CATORCE', 15: 'QUINCE',
                16: 'DIECISEIS', 17: 'DIECISIETE', 18: 'DIECIOCHO', 19: 'DIECINUEVE',
                21: 'VEINTIUNO', 22: 'VEINTIDOS', 23: 'VEINTITRES', 24: 'VEINTICUATRO',
                25: 'VEINTICINCO', 26: 'VEINTISEIS', 27: 'VEINTISIETE', 28: 'VEINTIOCHO', 29: 'VEINTINUEVE'
            };
            const centenas = ['', 'CIENTO', 'DOSCIENTOS', 'TRESCIENTOS', 'CUATROCIENTOS', 'QUINIENTOS', 'SEISCIENTOS', 'SETECIENTOS', 'OCHOCIENTOS', 'NOVECIENTOS'];

            function convertirSeccion(n) {
                if (n === 0) return '';
                if (n === 100) return 'CIEN';
                
                let str = '';
                const c = Math.floor(n / 100);
                const d = Math.floor((n % 100) / 10);
                const u = n % 10;
                const du = n % 100;

                if (c > 0) str += centenas[c] + ' ';

                if (du > 0) {
                    if (especiales[du]) {
                        str += especiales[du];
                    } else {
                        if (d > 0) {
                            str += decenas[d];
                            if (u > 0) str += ' Y ' + unidades[u];
                        } else if (u > 0) {
                            str += unidades[u];
                        }
                    }
                }
                return str.trim();
            }

            if (num === 0) return 'CERO PESOS CON 00/100 DOMINICANOS';

            const entero = Math.floor(num);
            const centavos = Math.round((num - entero) * 100);

            let resultado = '';

            if (entero >= 1000000) {
                const millones = Math.floor(entero / 1000000);
                const resto = entero % 1000000;
                resultado += (millones === 1 ? 'UN MILLÓN' : convertirSeccion(millones) + ' MILLONES') + ' ';
                if (resto > 0) resultado += convertirSeccion(Math.floor(resto / 1000)) + ' MIL ' + convertirSeccion(resto % 1000);
            } else if (entero >= 1000) {
                const miles = Math.floor(entero / 1000);
                const resto = entero % 1000;
                resultado += (miles === 1 ? 'MIL' : convertirSeccion(miles) + ' MIL') + ' ' + convertirSeccion(resto);
            } else {
                resultado += convertirSeccion(entero);
            }

            const centavosTexto = centavos < 10 ? '0' + centavos : centavos;
            return `${resultado.trim()} PESOS CON ${centavosTexto}/100 DOMINICANOS`;
        }

                compras.forEach(c => {

                        stock[name].comprado += (item.cantidad || 0);
                    });

                // Sumar cantidades vendidas
                facturas.forEach(f => {
                    f.items?.forEach(item => {
                        const name = item.nombre || item.text;
                        if (!stock[name]) {
                            stock[name] = { comprado: 0, vendido: 0, disponible: 0, marca: item.marca };
                        }
                        stock[name].vendido += (item.cantidad || item.amount || 0);
                    });
                });

                // Calcular disponibles
                Object.keys(stock).forEach(key => {
                    stock[key].disponible = stock[key].comprado - stock[key].vendido;
                });

                return stock;
            }, [productos, compras, facturas]);

            const estadisticas = useMemo(() => {
                const totalVentas = facturas.reduce((acc, f) => acc + (f.total || 0), 0);
                const totalRecaudado = recibos.reduce((acc, r) => acc + (r.montoRecibido || 0), 0);
                
                let saldoPendiente = 0;
                let excedenteTotal = 0;
                
                facturas.forEach(f => {
                    const bal = f.total - (f.montoPagado || 0);
                    if (bal > 0) {
                        saldoPendiente += bal;
                    } else if (bal < 0) {
                        excedenteTotal += Math.abs(bal);
                    }
                });
                
                let totalInversionCosto = 0;
                facturas.forEach(f => {
                    f.items?.forEach(item => {
                        const costoUnitario = item.costo || 0;
                        totalInversionCosto += (costoUnitario * (item.cantidad || item.amount || 0));
                    });
                });
                
                const gananciaEstimadaTotal = totalVentas - totalInversionCosto;

                const ventasPorMarca = {
                    Nutrilite: 0,
                    Artistry: 0,
                    Glister: 0,
                    'G&H': 0,
                    Satinique: 0,
                    'Amway Home': 0,
                    Otros: 0
                };

                facturas.forEach(f => {
                    f.items?.forEach(item => {
                        const marca = ventasPorMarca[item.marca] !== undefined ? item.marca : 'Otros';
                        const totalItem = (item.cantidad || item.amount || 0) * (item.precioUnitario || 0);
                        const factorDescuento = f.subtotal > 0 ? (f.total / f.subtotal) : 1;
                        ventasPorMarca[marca] += totalItem * (isNaN(factorDescuento) ? 1 : factorDescuento);
                    });
                });

                const deudasClientes = {};
                clientes.forEach(c => {
                    deudasClientes[c.nombre] = { comprado: 0, pagado: 0, deudor: 0, excedente: 0, tel: c.telefono || '' };
                });

                facturas.forEach(f => {
                    const cNombre = f.clienteNombre || 'Sin Nombre';
                    if (!deudasClientes[cNombre]) {
                        deudasClientes[cNombre] = { comprado: 0, pagado: 0, deudor: 0, excedente: 0, tel: f.clienteTelefono || '' };
                    }
                    deudasClientes[cNombre].comprado += (f.total || 0);
                });

                recibos.forEach(r => {
                    const cNombre = r.clienteNombre || 'Sin Nombre';
                    if (deudasClientes[cNombre]) {
                        deudasClientes[cNombre].pagado += (r.montoRecibido || 0);
                    }
                });

                Object.keys(deudasClientes).forEach(key => {
                    const balance = deudasClientes[key].comprado - deudasClientes[key].pagado;
                    if (balance > 0) {
                        deudasClientes[key].deudor = balance;
                        deudasClientes[key].excedente = 0;
                    } else if (balance < 0) {
                        deudasClientes[key].deudor = 0;
                        deudasClientes[key].excedente = Math.abs(balance);
                    } else {
                        deudasClientes[key].deudor = 0;
                        deudasClientes[key].excedente = 0;
                    }
                });

                const clientesConDeuda = Object.entries(deudasClientes)
                    .map(([nombre, d]) => ({ nombre, ...d }))
                    .filter(c => c.deudor > 1);

                const clientesConExcedente = Object.entries(deudasClientes)
                    .map(([nombre, d]) => ({ nombre, ...d }))
                    .filter(c => c.excedente > 1);

                const totalInversionCompras = compras.reduce((acc, c) => acc + (c.total || 0), 0);

                return {
                    totalVentas,
                    totalRecaudado,
                    saldoPendiente,
                    excedenteTotal,
                    gananciaEstimadaTotal,
                    totalInversionCosto,
                    ventasPorMarca,
                    clientesConDeuda,
                    clientesConExcedente,
                    clientesTotales: clientes.length,

                } else if (campo === 'costo') {

                    const m = nuevosItems[index].margen || 35;

                    nuevosItems[index].precioUnitario = precioVal;
                    const c = nuevosItems[index].costo || 0;
                    if (c > 0) {
                        nuevosItems[index].margen = Math.round(((precioVal - c) / c) * 100);
                    }
                } else {
                    nuevosItems[index][campo] = valor;

                setNuevaFactura(prev => ({ ...prev, items: nuevosItems }));

            const handleSubmitFactura = (e) => {
                e.preventDefault();
                if (!nuevaFactura.clienteNombre) {
                    lanzarNotificacion('error', 'Falta Información', 'Por favor selecciona un cliente para la factura.');
                    return;

                for (const item of nuevaFactura.items) {
                    if (!item.nombre || item.nombre.trim() === '') {
                        lanzarNotificacion('error', 'Producto Incompleto', 'Todos los productos deben tener nombre.');

                    if ((item.cantidad || 0) <= 0) {

                        return;
                    }
                    if ((item.precioUnitario || 0) <= 0) {

                    const stockActual = stockDeProductos[item.nombre];

                }

                const subtotal = nuevaFactura.items.reduce((acc, item) => acc + ((item.cantidad || item.amount || 0) * (item.precioUnitario || 0)), 0);
                
                const descuentoCalculado = nuevaFactura.tipoDescuento === 'porcentaje'
                    ? Math.round(subtotal * ((nuevaFactura.descuento || 0) / 100))

                const total = Math.max(0, subtotal - descuentoCalculado);

                const facturaGuardar = {

            const handleFacturaSeleccionadaEnRecibo = (facturaId) => {

                const saldoAnterior = factura.total - factura.montoPagado;

            const handleSubmitRecibo = (e) => {
                e.preventDefault();
                const factura = facturas.find(f => f.id === nuevoRecibo.facturaId);
                if (!factura) {
                    lanzarNotificacion('error', 'Factura Inválida', 'Selecciona una factura de referencia.');
                    return;
                }

                const saldoAnterior = factura.total - factura.montoPagado;
                const monto = parseFloat(nuevoRecibo.montoRecibido);

                if (monto <= 0 || isNaN(monto)) {
                    lanzarNotificacion('error', 'Monto Incorrecto', 'El monto recibido debe ser mayor a cero.');
                    return;
                }

                const numSig = recibos.length > 0 
                    ? Math.max(...recibos.map(r => parseInt(r.id.split('-')[1]) || 5000)) + 1 
                    : 5001;
                const reciboId = `R-${numSig}`;

                const saldoRestante = saldoAnterior - monto;

                const reciboGuardar = {
                    id: reciboId,
                    facturaId: nuevoRecibo.facturaId,
                    fechaPago: nuevoRecibo.fechaPago,
                    clienteNombre: factura.clienteNombre,
                    montoRecibido: monto,

                    metodoPago: nuevoRecibo.metodoPago,
                    concepto: nuevoRecibo.concepto || `Pago de factura ${factura.id}`,
                    saldoAnterior,
                    saldoRestante: saldoRestante
                };

                setRecibos(prev => [reciboGuardar, ...prev]);

                setFacturas(prevFacturas => {
                    return prevFacturas.map(f => {
                        if (f.id === factura.id) {
                            const nuevoPagado = f.montoPagado + monto;
                            let nuevoEstado = 'Parcial';
                            if (nuevoPagado >= f.total) nuevoEstado = 'Pagada';
                            else if (nuevoPagado === 0) nuevoEstado = 'Pendiente';

                            return { ...f, montoPagado: nuevoPagado, estado: nuevoEstado };
                        }
                        return f;
                    });
                });

                setMostrarCreadorRecibo(false);
                setNuevoRecibo({
                    facturaId: '',
                    fechaPago: new Date().toISOString().split('T')[0],
                    montoRecibido: 0,
                    metodoPago: 'Efectivo',
                    concepto: ''
                });
                
                if (saldoRestante < 0) {
                    lanzarNotificacion('success', 'Recibo Emitido con Excedente', `Se registró el abono de RD$ ${monto.toLocaleString()} en ${reciboId}. El cliente cuenta con RD$ ${Math.abs(saldoRestante).toLocaleString()} de saldo a favor.`);
                } else {
                    lanzarNotificacion('success', 'Recibo Emitido', `Se registró el recibo ${reciboId} con éxito.`);
                }
                setTab('recibos');
            };

            const handleAgregarProducto = (e) => {
                e.preventDefault();
                if (!nuevoProducto.nombre.trim() || !nuevoProducto.costo) {
                    lanzarNotificacion('error', 'Campos Incompletos', 'Completa el nombre y el costo del producto.');
                    return;
                }

                const costoNum = parseFloat(nuevoProducto.costo);
                if (isNaN(costoNum) || costoNum <= 0) {
                    lanzarNotificacion('error', 'Costo Inválido', 'El precio de costo debe ser un número positivo.');
                    return;
                }

                const idNuevo = `p-${Date.now()}`;
                const itemGuardar = {
                    id: idNuevo,
                    marca: nuevoProducto.marca,
                    nombre: nuevoProducto.nombre.trim(),
                    costo: costoNum
                };

                setProductos(prev => [itemGuardar, ...prev]);
                setNuevoProducto({ marca: 'Nutrilite', nombre: '', costo: '' });
                lanzarNotificacion('success', 'Producto Registrado', `"${itemGuardar.nombre}" fue añadido al catálogo.`);
            };

            const handleAddItemCompra = () => {
                setNuevaCompra(prev => ({
                    ...prev,
                    items: [...prev.items, { marca: 'Nutrilite', nombre: '', cantidad: 1, costoUnitario: 0 }]
                }));
            };

            const handleRemoveItemCompra = (index) => {
                const nuevosItems = [...nuevaCompra.items];
                nuevosItems.splice(index, 1);
                setNuevaCompra(prev => ({ ...prev, items: nuevosItems }));
            };

            const handleChangeItemCompra = (index, campo, valor) => {
                const nuevosItems = [...nuevaCompra.items];
                if (campo === 'nombre') {
                    const prodEncontrado = productos.find(p => p.nombre === valor);
                    if (prodEncontrado) {
                        nuevosItems[index].nombre = prodEncontrado.nombre;
                        nuevosItems[index].marca = prodEncontrado.marca;
                        nuevosItems[index].costoUnitario = prodEncontrado.costo;
                    } else {
                        nuevosItems[index].nombre = valor;
                    }
                } else if (campo === 'cantidad') {
                    nuevosItems[index].cantidad = parseInt(valor) || 0;
                } else if (campo === 'costoUnitario') {
                    nuevosItems[index].costoUnitario = parseFloat(valor) || 0;
                } else {
                    nuevosItems[index][campo] = valor;
                }
                setNuevaCompra(prev => ({ ...prev, items: nuevosItems }));
            };

            const handleSubmitCompra = (e) => {
                e.preventDefault();

                for (const item of nuevaCompra.items) {
                    if (!item.nombre || item.nombre.trim() === '') {
                        lanzarNotificacion('error', 'Producto Incompleto', 'Todos los productos deben tener nombre.');
                        return;
                    }
                    if ((item.cantidad || 0) <= 0) {
                        lanzarNotificacion('error', 'Cantidad Inválida', `La cantidad de "${item.nombre}" debe ser mayor a cero.`);
                        return;
                    }
                    if ((item.costoUnitario || 0) <= 0) {
                        lanzarNotificacion('error', 'Costo Inválido', `El costo unitario de "${item.nombre}" debe ser mayor a cero.`);
                        return;
                    }
                }

                const total = nuevaCompra.items.reduce((acc, item) => acc + ((item.cantidad || 0) * (item.costoUnitario || 0)), 0);
                const compraGuardar = {
                    ...nuevaCompra,
                    total
                };

                setCompras(prev => [compraGuardar, ...prev]);
                setMostrarCreadorCompra(false);
                setNuevaCompra({
                    id: '',
                    fecha: new Date().toISOString().split('T')[0],
                    items: [{ marca: 'Nutrilite', nombre: '', cantidad: 1, costoUnitario: 0 }]
                });

                lanzarNotificacion('success', 'Compra Registrada', `La Factura de Compra ${compraGuardar.id} se ingresó al inventario.`);
            };

            const handleEliminarFactura = (id) => {
                setModalConfirmar({
                    titulo: '¿Eliminar Factura?',
                    desc: `¿Estás completamente seguro de que deseas eliminar la factura ${id}? Esta acción es permanente y eliminará también todos los recibos de pago vinculados.`,
                    accion: () => {
                        setFacturas(prev => prev.filter(f => f.id !== id));
                        setRecibos(prev => prev.filter(r => r.facturaId !== id));
                        lanzarNotificacion('info', 'Factura Eliminada', `Se eliminó la factura ${id} y sus recibos.`);
                        setModalConfirmar(null);
                    }
                });
            };

            const handleAddItemCotizacion = () => {
                setNuevaCotizacion(prev => ({
                    ...prev,
                    items: [...prev.items, { marca: 'Nutrilite', nombre: '', cantidad: 1, costo: 0, margen: CONFIG_NEGOCIO.defaultMargen, precioUnitario: 0 }]
                }));
            };

            const handleRemoveItemCotizacion = (index) => {
                const nuevosItems = [...nuevaCotizacion.items];
                nuevosItems.splice(index, 1);
                setNuevaCotizacion(prev => ({ ...prev, items: nuevosItems }));
            };

            const handleChangeItemCotizacion = (index, campo, valor) => {
                const nuevosItems = [...nuevaCotizacion.items];
                if (campo === 'nombre') {
                    const prodEncontrado = productos.find(p => p.nombre === valor);
                    if (prodEncontrado) {
                        nuevosItems[index].nombre = prodEncontrado.nombre;
                        nuevosItems[index].marca = prodEncontrado.marca;
                        nuevosItems[index].costo = prodEncontrado.costo;
                        const m = nuevosItems[index].margen || CONFIG_NEGOCIO.defaultMargen;
                        nuevosItems[index].precioUnitario = Math.round(prodEncontrado.costo * (1 + m / 100));
                    } else {
                        nuevosItems[index].nombre = valor;
                    }
                } else if (campo === 'costo') {
                    const costoVal = parseFloat(valor) || 0;
                    nuevosItems[index].costo = costoVal;
                    const m = nuevosItems[index].margen || CONFIG_NEGOCIO.defaultMargen;
                    nuevosItems[index].precioUnitario = Math.round(costoVal * (1 + m / 100));
                } else if (campo === 'margen') {
                    const margenVal = parseFloat(valor) || 0;
                    nuevosItems[index].margen = margenVal;
                    const c = nuevosItems[index].costo || 0;
                    nuevosItems[index].precioUnitario = Math.round(c * (1 + margenVal / 100));
                } else if (campo === 'precioUnitario') {
                    const precioVal = parseFloat(valor) || 0;
                    nuevosItems[index].precioUnitario = precioVal;
                    const c = nuevosItems[index].costo || 0;
                    if (c > 0) {
                        nuevosItems[index].margen = Math.round(((precioVal - c) / c) * 100);
                    }
                } else if (campo === 'cantidad') {
                    nuevosItems[index].cantidad = parseInt(valor) || 1;
                } else {
                    nuevosItems[index][campo] = valor;
                }
                setNuevaCotizacion(prev => ({ ...prev, items: nuevosItems }));
            };

            const handleSubmitCotizacion = (e) => {
                e.preventDefault();
                if (!nuevaCotizacion.clienteNombre) {
                    lanzarNotificacion('error', 'Falta Información', 'Selecciona un cliente para la cotización.');
                    return;
                }
                for (const item of nuevaCotizacion.items) {
                    if (!item.nombre || item.nombre.trim() === '') {
                        lanzarNotificacion('error', 'Producto Incompleto', 'Todos los productos deben tener nombre.');
                        return;
                    }
                    if ((item.cantidad || 0) <= 0) {
                        lanzarNotificacion('error', 'Cantidad Inválida', `La cantidad de "${item.nombre}" debe ser mayor a cero.`);
                        return;
                    }
                }

                const subtotal = nuevaCotizacion.items.reduce((acc, item) => acc + ((item.cantidad || 0) * (item.precioUnitario || 0)), 0);
                const descuentoCalculado = nuevaCotizacion.tipoDescuento === 'porcentaje'
                    ? Math.round(subtotal * ((nuevaCotizacion.descuento || 0) / 100))
                    : parseFloat(nuevaCotizacion.descuento || 0);
                const total = Math.max(0, subtotal - descuentoCalculado);

                const cotizacionGuardar = {
                    ...nuevaCotizacion,
                    descuento: descuentoCalculado,
                    subtotal,
                    total,
                    estado: 'Pendiente'
                };

                setCotizaciones(prev => [cotizacionGuardar, ...prev]);
                setMostrarCreadorCotizacion(false);
                setNuevaCotizacion({
                    id: '',
                    fecha: new Date().toISOString().split('T')[0],
                    validez: 15,
                    clienteNombre: '',
                    clienteTelefono: '',
                    clienteEmail: '',
                    items: [{ marca: 'Nutrilite', nombre: '', cantidad: 1, costo: 0, margen: CONFIG_NEGOCIO.defaultMargen, precioUnitario: 0 }],
                    descuento: 0,
                    tipoDescuento: 'monto',
                    notas: ''
                });
                lanzarNotificacion('success', 'Cotización Generada', `La cotización ${cotizacionGuardar.id} fue creada exitosamente.`);
                setTab('cotizaciones');
            };

            const handleEliminarCotizacion = (id) => {
                setModalConfirmar({
                    titulo: '¿Eliminar Cotización?',
                    desc: `¿Deseas eliminar la cotización ${id}? Esta acción es permanente.`,
                    accion: () => {
                        setCotizaciones(prev => prev.filter(c => c.id !== id));
                        lanzarNotificacion('info', 'Cotización Eliminada', `Se eliminó la cotización ${id}.`);
                        setModalConfirmar(null);
                    }
                });
            };

            const handleAprobarCotizacion = (id) => {
                setCotizaciones(prev => prev.map(c => {
                    if (c.id === id) {
                        return { ...c, estado: 'Aprobada' };
                    }
                    return c;
                }));
                lanzarNotificacion('success', 'Cotización Aprobada', `La cotización ${id} fue marcada como aprobada.`);
            };

            const handleConvertirAFactura = (cotizacion) => {
                if (cotizacion.estado === 'Convertida') {
                    lanzarNotificacion('error', 'Ya Convertida', `La cotización ${cotizacion.id} ya fue convertida en factura.`);
                    return;
                }
                setModalConfirmar({
                    titulo: '¿Convertir a Factura?',
                    desc: `Se creará una factura a partir de la cotización ${cotizacion.id} por ${formatRD(cotizacion.total)}. La cotización se marcará como "Convertida".`,
                    accion: () => {
                        const numSig = facturas.length > 0
                            ? Math.max(...facturas.map(f => parseInt(f.id.split('-')[1]) || 1000)) + 1
                            : 1001;
                        const facturaNueva = {
                            id: `F-${numSig}`,
                            fecha: new Date().toISOString().split('T')[0],
                            clienteNombre: cotizacion.clienteNombre,
                            clienteTelefono: cotizacion.clienteTelefono,
                            clienteEmail: cotizacion.clienteEmail,
                            items: cotizacion.items.map(item => ({
                                marca: item.marca,
                                nombre: item.nombre,
                                cantidad: item.cantidad,
                                costo: item.costo,
                                margen: item.margen,
                                precioUnitario: item.precioUnitario
                            })),
                            descuento: cotizacion.descuento,
                            subtotal: cotizacion.subtotal,
                            total: cotizacion.total,
                            montoPagado: 0,
                            estado: 'Pendiente'
                        };
                        setFacturas(prev => [facturaNueva, ...prev]);
                        setCotizaciones(prev => prev.map(c => {
                            if (c.id === cotizacion.id) {
                                return { ...c, estado: 'Convertida' };
                            }
                            return c;
                        }));
                        lanzarNotificacion('success', 'Factura Creada', `Se generó la factura ${facturaNueva.id} desde la cotización ${cotizacion.id}.`);
                        setModalConfirmar(null);
                        setTab('facturas');
                    }
                });
            };

            const handleEliminarRecibo = (recibo) => {
                setModalConfirmar({
                    titulo: '¿Eliminar Recibo?',
                    desc: `¿Deseas eliminar el recibo ${recibo.id}? El monto se descontará y la factura restablecerá este saldo pendiente.`,
                    accion: () => {
                        setRecibos(prev => prev.filter(r => r.id !== recibo.id));
                        setFacturas(prevFacturas => {
                            return prevFacturas.map(f => {
                                if (f.id === recibo.facturaId) {
                                    const nuevoPagado = Math.max(0, f.montoPagado - recibo.montoRecibido);
                                    let nuevoEstado = 'Pendiente';
                                    if (nuevoPagado > 0 && nuevoPagado < f.total) nuevoEstado = 'Parcial';
                                    else if (nuevoPagado >= f.total) nuevoEstado = 'Pagada';

                                    return { ...f, montoPagado: nuevoPagado, estado: nuevoEstado };
                                }
                                return f;
                            });
                        });
                        lanzarNotificacion('info', 'Recibo Anulado', `Se eliminó el recibo ${recibo.id} correctamente.`);
                        setModalConfirmar(null);
                    }
                });
            };

            const handleEliminarCompra = (id) => {
                setModalConfirmar({
                    titulo: '¿Eliminar Factura de Compra?',
                    desc: `¿Deseas eliminar la compra de inventario ${id}? Esto alterará el balance de tus existencias de stock de forma inmediata.`,
                    accion: () => {
                        setCompras(prev => prev.filter(c => c.id !== id));
                        lanzarNotificacion('info', 'Registro Eliminado', `Se eliminó la factura de compra ${id}.`);
                        setModalConfirmar(null);
                    }
                });
            };

            const handleEliminarCliente = (nombreCliente) => {
                const facturasAsociadas = facturas.filter(f => f.clienteNombre === nombreCliente);
                const facturasIds = facturasAsociadas.map(f => f.id);

                setModalConfirmar({
                    titulo: '¿Eliminar Cliente por Completo?',
                    desc: `¿Estás seguro de que deseas eliminar permanentemente a "${nombreCliente}" del sistema? Se borrarán sus datos, facturas (${facturasAsociadas.length}) y todos sus recibos de pago de la base de datos de manera irreversible.`,
                    accion: () => {
                        setClientes(prev => prev.filter(c => c.nombre !== nombreCliente));
                        setFacturas(prev => prev.filter(f => f.clienteNombre !== nombreCliente));
                        setRecibos(prev => prev.filter(r => !facturasIds.includes(r.facturaId)));
                        lanzarNotificacion('info', 'Cliente Eliminado', `Se eliminó al cliente "${nombreCliente}" y todo su historial.`);
                        setModalConfirmar(null);
                    }
                });
            };

            const handleAbrirEdicionCliente = (nombreCliente) => {
                const registroCliente = clientes.find(c => c.nombre === nombreCliente) || {};
                setModalEditarCliente({
                    nombreOriginal: nombreCliente,
                    nuevoNombre: nombreCliente,
                    nuevoTelefono: registroCliente.telefono || '',
                    nuevoEmail: registroCliente.email || ''
                });
            };

            const handleGuardarEdicionCliente = (e) => {
                e.preventDefault();
                const { nombreOriginal, nuevoNombre, nuevoTelefono, nuevoEmail } = modalEditarCliente;

                if (!nuevoNombre.trim()) {
                    lanzarNotificacion('error', 'Nombre Vacío', 'El nombre no puede estar en blanco.');
                    return;
                }

                setClientes(prev => prev.map(c => {
                    if (c.nombre === nombreOriginal) {
                        return {
                            ...c,
                            nombre: nuevoNombre.trim(),
                            telefono: nuevoTelefono.trim(),
                            email: nuevoEmail.trim()
                        };
                    }
                    return c;
                }));

                setFacturas(prev => prev.map(f => {
                    if (f.clienteNombre === nombreOriginal) {
                        return {
                            ...f,
                            clienteNombre: nuevoNombre.trim(),
                            clienteTelefono: nuevoTelefono.trim(),
                            clienteEmail: nuevoEmail.trim()
                        };
                    }
                    return f;
                }));

                setRecibos(prev => prev.map(r => {
                    if (r.clienteNombre === nombreOriginal) {
                        return { ...r, clienteNombre: nuevoNombre.trim() };
                    }
                    return r;
                }));

                lanzarNotificacion('success', 'Cliente Actualizado', `Se guardaron los datos de "${nuevoNombre}" en el sistema.`);
                setModalEditarCliente(null);
            };

            const handleEliminarProducto = (id, nombre) => {
                setModalConfirmar({
                    titulo: 'Eliminar del Catálogo',
                    desc: `¿Deseas retirar "${nombre}" de tu lista de precios de manera permanente?`,
                    accion: () => {
                        setProductos(prev => prev.filter(p => p.id !== id));
                        lanzarNotificacion('info', 'Catálogo Actualizado', `Se retiró el producto del catálogo.`);
                        setModalConfirmar(null);
                    }
                });
            };

            const activarEdicionProducto = (prod) => {
                setEditandoProdId(prod.id);
                setEditandoProdCampos({ nombre: prod.nombre, costo: prod.costo });
            };

            const guardarEdicionProducto = (id) => {
                const costoParsed = parseFloat(editandoProdCampos.costo);
                if (!editandoProdCampos.nombre.trim() || isNaN(costoParsed) || costoParsed <= 0) {
                    lanzarNotificacion('error', 'Datos Inválidos', 'Revisa el costo y el nombre del producto.');
                    return;
                }
                setProductos(prev => prev.map(p => {
                    if (p.id === id) {
                        return { ...p, nombre: editandoProdCampos.nombre.trim(), costo: costoParsed };
                    }
                    return p;
                }));
                setEditandoProdId(null);
                lanzarNotificacion('success', 'Cambios Guardados', 'El producto fue actualizado.');
            };

            const handleRestablecerDemostracion = () => {
                setModalConfirmar({
                    titulo: 'Cargar Datos de Simulación',
                    desc: '¿Quieres restablecer la base de datos con la información de prueba sugerida del Amway Demo? Se reemplazará tu historial actual.',
                    accion: () => {
                        setProductos(PRODUCTOS_SUGERIDOS_DEMO);
                        setClientes(CLIENTES_SUGERIDOS_DEMO);
                        setFacturas(FACTURAS_SUGERIDAS_DEMO);
                        setRecibos(RECIBOS_SUGERIDOS_DEMO);
                        setCompras(COMPRAS_SUGERIDAS_DEMO);
                        setCotizaciones(COTIZACIONES_SUGERIDAS_DEMO);
                        safeSetLocalStorage('almaia_catalogo_v6', PRODUCTOS_SUGERIDOS_DEMO);
                        safeSetLocalStorage('almaia_clientes_v6', CLIENTES_SUGERIDOS_DEMO);
                        safeSetLocalStorage('almaia_facturas_v6', FACTURAS_SUGERIDAS_DEMO);
                        safeSetLocalStorage('almaia_recibos_v6', RECIBOS_SUGERIDOS_DEMO);
                        safeSetLocalStorage('almaia_compras_v6', COMPRAS_SUGERIDAS_DEMO);
                        safeSetLocalStorage('almaia_cotizaciones_v6', COTIZACIONES_SUGERIDAS_DEMO);
                        lanzarNotificacion('success', 'Demo Cargado', 'Se cargó el catálogo, clientes, compras, facturas y cotizaciones sugeridos.');
                        setModalConfirmar(null);
                    }
                });
            };

            const formatRD = (monto) => {
                return new Intl.NumberFormat('es-DO', { style: 'currency', currency: 'DOP' }).format(monto || 0);
            };

            const handleExportarDatos = () => {
                const backup = {
                    version: '6.0',
                    fecha: new Date().toISOString(),
                    negocio: CONFIG_NEGOCIO,
                    productos,
                    clientes,
                    facturas,
                    recibos,
                    compras,
                    cotizaciones
                };
                const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Almaia_RD_Backup_${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                lanzarNotificacion('success', 'Respaldo Exportado', 'Se descargó el archivo JSON con todos tus datos.');
            };

            const handleImportarDatos = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const data = JSON.parse(evt.target.result);
                        if (!data.productos || !data.clientes || !data.facturas) {
                            throw new Error('Formato de respaldo inválido');
                        }
                        setModalConfirmar({
                            titulo: '¿Importar Respaldo?',
                            desc: `Se cargará el respaldo del ${data.fecha || 'fecha desconocida'}. Se reemplazará todo el historial actual (${data.facturas.length} facturas, ${data.recibos?.length || 0} recibos, ${data.clientes.length} clientes).`,
                            accion: () => {
                                setProductos(data.productos);
                                setClientes(data.clientes);
                                setFacturas(data.facturas);
                                setRecibos(data.recibos || []);
                                setCompras(data.compras || []);
                                setCotizaciones(data.cotizaciones || []);
                                safeSetLocalStorage('almaia_catalogo_v6', data.productos);
                                safeSetLocalStorage('almaia_clientes_v6', data.clientes);
                                safeSetLocalStorage('almaia_facturas_v6', data.facturas);
                                safeSetLocalStorage('almaia_recibos_v6', data.recibos || []);
                                safeSetLocalStorage('almaia_compras_v6', data.compras || []);
                                safeSetLocalStorage('almaia_cotizaciones_v6', data.cotizaciones || []);
                                lanzarNotificacion('success', 'Respaldo Importado', 'Los datos se cargaron exitosamente.');
                                setModalConfirmar(null);
                            }
                        });
                    } catch (err) {
                        lanzarNotificacion('error', 'Error de Importación', 'El archivo no tiene un formato válido de respaldo de Almaia RD.');
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            return (
                <div className="flex flex-col min-h-screen">
                    
                    {/* BANNER DE NOTIFICACIONES */}
                    {notificacion && (
                        <div className="fixed top-5 right-5 z-50 max-w-sm w-full bg-white border-l-4 border-[#B8837E] shadow-xl rounded-xl p-4 transition-all duration-300 flex items-start space-x-3 print:hidden">
                          <div className="p-1 bg-amber-50 rounded-lg text-amber-700">
                            {notificacion.tipo === 'success' ? <CheckCircleIcon className="w-5 h-5 text-[#A5B8A6]" /> : <AlertCircleIcon className="w-5 h-5 text-[#B8837E]" />}
                          </div>
                          <div className="flex-grow text-xs">
                            <h4 className="font-bold text-stone-900">{notificacion.titulo}</h4>
                            <p className="text-stone-500 mt-0.5">{notificacion.desc}</p>
                          </div>
                          <button onClick={() => setNotificacion(null)} className="text-stone-300 hover:text-stone-500 text-xs font-bold">✕</button>
                        </div>
                    )}

                    {/* MODAL DE CONFIRMACIÓN */}
                    {modalConfirmar && (
                        <div className="fixed inset-0 z-[70] bg-stone-900/40 backdrop-blur-xs flex items-center justify-center p-4 print:hidden">
                            <div className="bg-white rounded-2xl shadow-xl border border-stone-200/60 max-w-md w-full p-6 space-y-4">
                                <div className="flex items-center space-x-3 text-[#B8837E]">
                                    <AlertCircleIcon className="w-6 h-6 flex-shrink-0" />
                                    <h3 className="text-sm font-bold">{modalConfirmar.titulo}</h3>
                                </div>
                                <p className="text-xs text-stone-600 leading-relaxed">{modalConfirmar.desc}</p>
                                <div className="flex justify-end space-x-2 pt-2 text-xs">
                                    <button 
                                        onClick={() => setModalConfirmar(null)}
                                        className="px-4 py-2 font-bold bg-stone-100 hover:bg-stone-200 text-stone-700 rounded-xl"
                                    >
                                        Cancelar
                                    </button>
                                    <button 
                                        onClick={modalConfirmar.accion}

                            </div>
                        )}

                        {/* MODAL: REGISTRAR COMPRA */}
                        {mostrarCreadorCompra && (
                            <div className="fixed inset-0 z-50 bg-stone-900/60 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
                                <div className="bg-white rounded-2xl shadow-xl border border-stone-200/50 w-full max-w-4xl max-h-[90vh] flex flex-col text-xs">
                                    
                                    <div className="p-6 border-b border-stone-100 flex justify-between items-center bg-[#5C3E35] text-white rounded-t-2xl">
                                        <div>
                                            <h3 className="text-sm sm:text-base font-black uppercase tracking-wider">Registrar Factura de Compra / Entrada</h3>
                                            <p className="text-stone-300">Introduce los artículos y costos de adquisición del inventario para Almaia RD.</p>
                                        </div>
                                        <button onClick={() => setMostrarCreadorCompra(false)} className="text-stone-300 hover:text-white font-bold text-lg">✕</button>
                                    </div>

                                    <form onSubmit={handleSubmitCompra} className="p-6 overflow-y-auto space-y-6 flex-grow">
                                        
                                        <div className="grid grid-cols-2 gap-4 bg-[#FAF6F0]/40 p-3.5 rounded-xl border">
                                            <div>
                                                <label className="block text-stone-500 font-bold uppercase mb-1">No. Compra (Autogenerado)</label>
                                                <input 
                                                    type="text" 
                                                    value={nuevaCompra.id}
                                                    disabled
                                                    className="w-full bg-stone-200/60 border-none rounded-lg p-2 font-bold text-stone-600 cursor-not-allowed"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-stone-500 font-bold uppercase mb-1">Fecha de Compra</label>
                                                <input 
                                                    type="date" 
                                                    value={nuevaCompra.fecha}
                                                    required
                                                    onChange={(e) => setNuevaCompra(prev => ({ ...prev, fecha: e.target.value }))}
                                                    className="w-full bg-white border border-stone-200 rounded-lg p-2 font-semibold"
                                                />
                                            </div>
                                        </div>

                                        <div className="space-y-3">
                                            <div className="flex justify-between items-center border-b pb-1">
                                                <h4 className="font-bold uppercase tracking-wider text-[#B8837E]">Productos Adquiridos en esta Factura</h4>
                                                <button 
                                                    type="button"
                                                    onClick={handleAddItemCompra}
                                                    className="text-[#B8837E] hover:text-[#A3736E] font-bold flex items-center gap-1"
                                                >
                                                    <PlusIcon className="w-4 h-4" /> Añadir Fila
                                                </button>
                                            </div>

                                            <div className="space-y-2.5">
                                                {nuevaCompra.items.map((item, index) => (
                                                    <div key={index} className="grid grid-cols-12 gap-2 p-3 bg-stone-50 rounded-xl border border-stone-200/50 items-end">
                                                        
                                                        <div className="col-span-3 sm:col-span-2">
                                                            <label className="block text-stone-500 font-bold mb-1">Marca</label>
                                                            <select 
                                                                value={item.marca}
                                                                onChange={(e) => handleChangeItemCompra(index, 'marca', e.target.value)}
                                                                className="w-full bg-white border border-stone-200 rounded-lg p-1.5 font-semibold"
                                                            >
                                                                <option value="Nutrilite">Nutrilite</option>
                                                                <option value="Artistry">Artistry</option>
                                                                <option value="Glister">Glister</option>
                                                                <option value="G&H">G&H</option>
                                                                <option value="Satinique">Satinique</option>
                                                                <option value="Amway Home">Amway Home</option>
                                                                <option value="Otros">Otros</option>
                                                            </select>
                                                        </div>

                                                        <div className="col-span-9 sm:col-span-4">
                                                            <label className="block text-stone-500 font-bold mb-1">Selecciona o escribe producto</label>
                                                            <input
                                                                type="text"
                                                                placeholder="Buscar de lista..."
                                                                required
                                                                list="catalogo-ventas"
                                                                value={item.nombre}
                                                                onChange={(e) => handleChangeItemCompra(index, 'nombre', e.target.value)}
                                                                className="w-full bg-white border border-stone-200 rounded-lg p-1.5 font-bold text-stone-800"
                                                            />
                                                        </div>

                                                        <div className="col-span-4 sm:col-span-2">
                                                            <label className="block text-stone-500 font-bold mb-1">Cant. Comprada</label>
                                                            <input 
                                                                type="number" 
                                                                min="1"
                                                                required
                                                                value={item.cantidad}
                                                                onChange={(e) => handleChangeItemCompra(index, 'cantidad', parseInt(e.target.value) || 0)}
                                                                className="w-full bg-white border border-stone-200 rounded-lg p-1.5 text-center font-bold"
                                                            />
                                                        </div>

                                                        <div className="col-span-6 sm:col-span-3">
                                                            <label className="block text-stone-500 font-bold mb-1">Costo Unit. de Compra (RD$)</label>
                                                            <input 
                                                                type="number" 
                                                                min="0.01"
                                                                step="0.01"
                                                                required
                                                                value={item.costoUnitario || ''}
                                                                onChange={(e) => handleChangeItemCompra(index, 'costoUnitario', parseFloat(e.target.value) || 0)}
                                                                className="w-full bg-[#FDFBF9] border rounded-lg p-1.5 text-right font-black text-stone-900"
                                                            />
                                                        </div>

                                                        <div className="col-span-1 text-right">
                                                            {nuevaCompra.items.length > 1 && (
                                                                <button 
                                                                    type="button"
                                                                    onClick={() => handleRemoveItemCompra(index)}
                                                                    className="text-stone-400 hover:text-rose-600 p-2"
                                                                >
                                                                    <TrashIcon className="w-4 h-4" />
                                                                </button>
                                                            )}
                                                        </div>

                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="flex justify-end p-4 bg-[#FAF8F5] rounded-xl border">
                                            {(() => {
                                                const totalInversion = nuevaCompra.items.reduce((acc, item) => acc + ((item.cantidad || 0) * (item.costoUnitario || 0)), 0);
                                                return (
                                                    <div className="text-right space-y-1.5 w-full sm:w-1/3 text-stone-700">
                                                        <div className="flex justify-between text-base font-black text-stone-900">
                                                            <span>Inversión Total Bruta:</span>
                                                            <span>{formatRD(totalInversion)}</span>
                                                        </div>
                                                    </div>
                                                );
                                            })()}
                                        </div>

                                        <div className="flex justify-end space-x-2 pt-4 border-t border-stone-200">
                                            <button
                                                type="button"
                                                onClick={() => setMostrarCreadorCompra(false)}
                                                className="px-4 py-2 bg-stone-100 hover:bg-stone-200 text-stone-700 font-bold rounded-xl"
                                            >
                                                Cancelar
                                            </button>
                                            <button
                                                type="submit"
                                                className="px-6 py-2 bg-[#A5B8A6] hover:bg-[#91A592] text-stone-900 font-bold rounded-xl flex items-center gap-1.5"
                                            >
                                                <CheckCircleIcon className="w-4 h-4" /> Registrar Compra
                                            </button>
                                        </div>

                                    </form>
                                </div>
                            </div>
                        )}

                        {/* MODAL: NUEVA COTIZACIÓN */}
                        {mostrarCreadorCotizacion && (
                            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                                <div className="bg-white rounded-2xl shadow-2xl max-w-4xl w-full max-h-[95vh] overflow-y-auto">
                                    <div className="p-4 sm:p-6 border-b border-stone-100 flex justify-between items-center bg-[#FAF6F0]/50 rounded-t-2xl">
                                        <div>
                                            <h3 className="font-black text-stone-900 text-lg">Nueva Cotización</h3>
                                            <p className="text-stone-500 text-xs mt-0.5">ID: <span className="font-bold">{nuevaCotizacion.id}</span></p>
                                        </div>
                                        <button onClick={() => setMostrarCreadorCotizacion(false)}
                                            className="p-2 hover:bg-stone-100 rounded-lg transition-all text-stone-500 hover:text-red-600">
                                            <XIcon className="w-5 h-5" />
                                        </button>
                                    </div>

                                    <form onSubmit={handleSubmitCotizacion} className="p-4 sm:p-6 space-y-6">
                                        {/* Datos del Cliente */}
                                        <div className="space-y-3">
                                            <h4 className="font-bold text-stone-900 text-sm uppercase tracking-wider">Datos del Cliente</h4>
                                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                                <div>
                                                    <label className="text-[10px] font-bold text-stone-500 uppercase">Nombre *</label>
                                                    <input type="text" list="catalogo-clientes" required value={nuevaCotizacion.clienteNombre}
                                                        onChange={(e) => setNuevaCotizacion(prev => ({ ...prev, clienteNombre: e.target.value }))}
                                                        className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#B8837E] focus:border-transparent transition-all text-stone-900"
                                                        placeholder="Seleccionar o escribir nombre" />
                                                    <datalist id="catalogo-clientes">
                                                        {clientes.map(cl => (
                                                            <option key={cl.id} value={cl.nombre}>
                                                                {cl.telefono ? cl.telefono : ''}
                                                            </option>
                                                        ))}
                                                    </datalist>
                                                </div>
                                                <div>
                                                    <label className="text-[10px] font-bold text-stone-500 uppercase">Teléfono</label>
                                                    <input type="text" value={nuevaCotizacion.clienteTelefono}
                                                        onChange={(e) => setNuevaCotizacion(prev => ({ ...prev, clienteTelefono: e.target.value }))}
                                                        className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#B8837E] focus:border-transparent transition-all text-stone-900"
                                                        placeholder="809-000-0000" />
                                                </div>
                                                <div>
                                                    <label className="text-[10px] font-bold text-stone-500 uppercase">Email</label>
                                                    <input type="email" value={nuevaCotizacion.clienteEmail}
                                                        onChange={(e) => setNuevaCotizacion(prev => ({ ...prev, clienteEmail: e.target.value }))}
                                                        className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#B8837E] focus:border-transparent transition-all text-stone-900"
                                                        placeholder="correo@ejemplo.com" />
                                                </div>
                                            </div>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                <div>
                                                    <label className="text-[10px] font-bold text-stone-500 uppercase">Fecha</label>
                                                    <input type="date" required value={nuevaCotizacion.fecha}
                                                        onChange={(e) => setNuevaCotizacion(prev => ({ ...prev, fecha: e.target.value }))}
                                                        className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#B8837E] focus:border-transparent transition-all text-stone-900" />
                                                </div>
                                                <div>
                                                    <label className="text-[10px] font-bold text-stone-500 uppercase">Validez (días)</label>
                                                    <input type="number" required min="1" value={nuevaCotizacion.validez}
                                                        onChange={(e) => setNuevaCotizacion(prev => ({ ...prev, validez: parseInt(e.target.value) || 15 }))}
                                                        className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#B8837E] focus:border-transparent transition-all text-stone-900" />
                                                </div>
                                            </div>
                                        </div>

                                        {/* Productos */}
                                        <div className="space-y-3">
                                            <div className="flex justify-between items-center">
                                                <h4 className="font-bold text-stone-900 text-sm uppercase tracking-wider">Productos</h4>
                                                <button type="button" onClick={handleAddItemCotizacion}
                                                    className="px-3 py-1.5 bg-stone-100 hover:bg-stone-200 text-stone-700 text-xs font-bold rounded-lg flex items-center gap-1 transition-all">
                                                    <span>+</span> Agregar Producto
                                                </button>
                                            </div>
                                            <div className="space-y-2">
                                                {nuevaCotizacion.items.map((item, idx) => (
                                                    <div key={idx} className="bg-stone-50 p-3 rounded-xl border border-stone-200 grid grid-cols-12 gap-2 items-end">
                                                        <div className="col-span-12 sm:col-span-3">
                                                            {idx === 0 && <label className="text-[10px] font-bold text-stone-500 uppercase block mb-1">Marca</label>}
                                                            <select value={item.marca}
                                                                onChange={(e) => handleChangeItemCotizacion(idx, 'marca', e.target.value)}
                                                                className="w-full p-2 bg-white border border-stone-200 rounded-lg text-xs text-stone-900 focus:outline-none focus:ring-1 focus:ring-[#B8837E]">
                                                                {MARCAS.map(m => <option key={m} value={m}>{m}</option>)}
                                                            </select>
                                                        </div>
                                                        <div className="col-span-12 sm:col-span-3">
                                                            {idx === 0 && <label className="text-[10px] font-bold text-stone-500 uppercase block mb-1">Producto *</label>}
                                                            <input type="text" list="catalogo-ventas" required value={item.nombre}
                                                                onChange={(e) => handleChangeItemCotizacion(idx, 'nombre', e.target.value)}
                                                                className="w-full p-2 bg-white border border-stone-200 rounded-lg text-xs text-stone-900 focus:outline-none focus:ring-1 focus:ring-[#B8837E]"
                                                                placeholder="Buscar producto..." />
                                                        </div>
                                                        <div className="col-span-3 sm:col-span-1">
                                                            {idx === 0 && <label className="text-[10px] font-bold text-stone-500 uppercase block mb-1">Cant.</label>}
                                                            <input type="number" min="1" required value={item.cantidad}
                                                                onChange={(e) => handleChangeItemCotizacion(idx, 'cantidad', e.target.value)}
                                                                className="w-full p-2 bg-white border border-stone-200 rounded-lg text-xs text-center text-stone-900 focus:outline-none focus:ring-1 focus:ring-[#B8837E]" />
                                                        </div>
                                                        <div className="col-span-3 sm:col-span-1">
                                                            {idx === 0 && <label className="text-[10px] font-bold text-stone-500 uppercase block mb-1">Costo</label>}
                                                            <input type="number" min="0" value={item.costo}
                                                                onChange={(e) => handleChangeItemCotizacion(idx, 'costo', e.target.value)}
                                                                className="w-full p-2 bg-white border border-stone-200 rounded-lg text-xs text-center text-stone-900 focus:outline-none focus:ring-1 focus:ring-[#B8837E]" />
                                                        </div>
                                                        <div className="col-span-3 sm:col-span-1">
                                                            {idx === 0 && <label className="text-[10px] font-bold text-stone-500 uppercase block mb-1">Margen %</label>}
                                                            <input type="number" min="0" max="100" value={item.margen}
                                                                onChange={(e) => handleChangeItemCotizacion(idx, 'margen', e.target.value)}
                                                                className="w-full p-2 bg-white border border-stone-200 rounded-lg text-xs text-center text-stone-900 focus:outline-none focus:ring-1 focus:ring-[#B8837E]" />
                                                        </div>
                                                        <div className="col-span-3 sm:col-span-2">
                                                            {idx === 0 && <label className="text-[10px] font-bold text-stone-500 uppercase block mb-1">Precio Und.</label>}
                                                            <input type="number" min="0" required value={item.precioUnitario}
                                                                onChange={(e) => handleChangeItemCotizacion(idx, 'precioUnitario', e.target.value)}
                                                                className="w-full p-2 bg-white border border-stone-200 rounded-lg text-xs text-center text-stone-900 focus:outline-none focus:ring-1 focus:ring-[#B8837E]" />
                                                        </div>
                                                        <div className="col-span-3 sm:col-span-1 text-right">
                                                            {idx === 0 && <label className="text-[10px] font-bold text-transparent block mb-1">-</label>}
                                                            {nuevaCotizacion.items.length > 1 && (
                                                                <button type="button" onClick={() => handleRemoveItemCotizacion(idx)}
                                                                    className="p-2 hover:bg-red-50 hover:text-red-600 text-stone-400 rounded-lg transition-all">
                                                                    <TrashIcon className="w-3.5 h-3.5" />
                                                                </button>
                                                            )}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        {/* Notas, Descuento y Totales */}
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                            <div className="space-y-3">
                                                <h4 className="font-bold text-stone-900 text-sm uppercase tracking-wider">Notas / Condiciones</h4>
                                                <textarea rows="3" value={nuevaCotizacion.notas}
                                                    onChange={(e) => setNuevaCotizacion(prev => ({ ...prev, notas: e.target.value }))}
                                                    className="w-full p-3 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#B8837E] focus:border-transparent transition-all text-stone-900 resize-none"
                                                    placeholder="Instrucciones, condiciones, detalles especiales..." />
                                            </div>

                                            <div className="space-y-3 bg-stone-50 p-4 rounded-xl border border-stone-200">
                                                <h4 className="font-bold text-stone-900 text-sm uppercase tracking-wider">Totales</h4>
                                                <div className="space-y-2">
                                                    <div className="flex items-center gap-2">
                                                        <select value={nuevaCotizacion.tipoDescuento}
                                                            onChange={(e) => setNuevaCotizacion(prev => ({ ...prev, tipoDescuento: e.target.value }))}
                                                            className="p-2 bg-white border border-stone-200 rounded-lg text-xs font-bold text-stone-700 focus:outline-none focus:ring-1 focus:ring-[#B8837E]">
                                                            <option value="monto">RD$</option>
                                                            <option value="porcentaje">%</option>
                                                        </select>
                                                        <input type="number" min="0" value={nuevaCotizacion.descuento}
                                                            onChange={(e) => setNuevaCotizacion(prev => ({ ...prev, descuento: parseFloat(e.target.value) || 0 }))}
                                                            className="w-full p-2 bg-white border border-stone-200 rounded-lg text-xs font-bold text-stone-900 focus:outline-none focus:ring-1 focus:ring-[#B8837E]"
                                                            placeholder="0" />
                                                        <span className="text-xs font-bold text-stone-500">Descuento</span>
                                                    </div>
                                                </div>
                                                <div className="space-y-2 pt-2 border-t border-stone-200">
                                                    <div className="flex justify-between text-xs font-bold">
                                                        <span className="text-stone-500">Subtotal:</span>
                                                        <span className="text-stone-900">{formatRD(nuevaCotizacion.items.reduce((acc, it) => acc + ((it.cantidad || 0) * (it.precioUnitario || 0)), 0))}</span>
                                                    </div>
                                                    <div className="flex justify-between text-xs font-bold">
                                                        <span className="text-red-500">Descuento:</span>
                                                        <span className="text-red-500">
                                                            - {formatRD(nuevaCotizacion.tipoDescuento === 'porcentaje'
                                                                ? Math.round(nuevaCotizacion.items.reduce((acc, it) => acc + ((it.cantidad || 0) * (it.precioUnitario || 0)), 0) * ((nuevaCotizacion.descuento || 0) / 100))
                                                                : parseFloat(nuevaCotizacion.descuento || 0))}
                                                        </span>
                                                    </div>
                                                    <div className="flex justify-between text-sm font-black border-t border-stone-200 pt-2">
                                                        <span className="text-stone-900">TOTAL ESTIMADO:</span>
                                                        <span className="text-[#B8837E]">
                                                            {formatRD(Math.max(0,
                                                                nuevaCotizacion.items.reduce((acc, it) => acc + ((it.cantidad || 0) * (it.precioUnitario || 0)), 0)
                                                                - (nuevaCotizacion.tipoDescuento === 'porcentaje'
                                                                    ? Math.round(nuevaCotizacion.items.reduce((acc, it) => acc + ((it.cantidad || 0) * (it.precioUnitario || 0)), 0) * ((nuevaCotizacion.descuento || 0) / 100))
                                                                    : parseFloat(nuevaCotizacion.descuento || 0))
                                                            ))}
                                                        </span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="flex justify-end gap-3 pt-4 border-t border-stone-100">
                                            <button type="button" onClick={() => setMostrarCreadorCotizacion(false)}
                                                className="px-5 py-2.5 bg-stone-100 hover:bg-stone-200 text-stone-700 font-bold rounded-xl transition-all text-sm">
                                                Cancelar
                                            </button>
                                            <button type="submit"
                                                className="px-6 py-2.5 bg-[#B8837E] hover:bg-[#A0746E] text-white font-bold rounded-xl flex items-center gap-1.5 shadow-sm transition-all text-sm">
                                                <ClipboardListIcon className="w-4 h-4" /> Generar Cotización
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* LISTA DE DATOS PARA AUTOCOMPLETADO */}
                        <datalist id="catalogo-ventas">
                            {productos.map(p => (
                                <option key={p.id} value={p.nombre}>{p.marca}</option>
                            ))}
                        </datalist>

                    </div>
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
